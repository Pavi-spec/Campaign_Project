
<sly data-sly-use.model="com.drive.core.models.LoginButtonModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='drive.login-button'}"/>

<div class="login-button-component">

    <button type="submit"
            class="login-button"
            data-login-submit
            data-login-destination="${model.buttonLink @ extension='html'}"
            data-login-new-tab="${model.openInNewTab}">
        ${model.buttonText || 'Login'}
    </button>

    <div data-sly-test="${wcmmode.edit && !model.buttonText}"
         class="cq-placeholder"
         data-emptytext="Login Button">
    </div>

</div>
