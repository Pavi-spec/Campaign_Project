<sly data-sly-use.model="com.drive.core.models.TestimonialModel"/>

<div class="testimonial-edit-preview">

    <h2 class="testimonial-edit-preview__title">
        ${model.title}
    </h2>

    <div
            class="testimonial-edit-preview__content"
            data-testimonial-edit-carousel>

        <button
                type="button"
                class="testimonial-edit-preview__arrow testimonial-edit-preview__arrow--previous"
                data-testimonial-edit-previous
                aria-label="Previous testimonial">
            ←
        </button>

        <div class="testimonial-edit-preview__viewport">

            <div
                    class="testimonial-edit-preview__track"
                    data-sly-list.item="${model.testimonials}">

                <article class="testimonial-edit-preview__card">

                    <h2 class="testimonial-edit-preview__name">
                        ${item.name}
                    </h2>

                    <div class="testimonial-edit-preview__rating">

                        <span class="testimonial-edit-preview__filled-stars">
                            ${item.filledStars}
                        </span>

                        <span class="testimonial-edit-preview__empty-stars">
                            ${item.emptyStars}
                        </span>

                    </div>

                    <p class="testimonial-edit-preview__review">
                        ${item.review}
                    </p>

                    <div class="testimonial-edit-preview__source">
                        ${item.source}
                    </div>

                    <div class="testimonial-edit-preview__date">
                        ${item.date}
                    </div>

                </article>

            </div>

        </div>

        <button
                type="button"
                class="testimonial-edit-preview__arrow testimonial-edit-preview__arrow--next"
                data-testimonial-edit-next
                aria-label="Next testimonial">
            →
        </button>

    </div>

    <div
            data-sly-test="${model.testimonials.size == 0}"
            class="testimonial-edit-preview__empty">

        <p>
            Add testimonials using the dialog.
        </p>

    </div>

</div>
