<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>

<sly data-sly-call="${clientlib.css @ categories='drive.faq'}"/>
<sly data-sly-call="${clientlib.js @ categories='drive.faq'}"/>

<sly data-sly-use.model="com.drive.core.models.FaqModel"/>

<div class="course-details">

    <div class="course-details__container">

        <h2 class="course-details__heading">
            Course Details
        </h2>

        <sly data-sly-list.item="${model.items}">

            <div class="course-details__item">

                <button
                        type="button"
                        class="course-details__button"
                        onclick="toggleAccordion(this)">

                    <span class="course-details__title">
                        ${item.title}
                    </span>

                    <span class="course-details__icon">
                        +
                    </span>

                </button>

                <div class="course-details__content">

                    <p>
                        ${item.content}
                    </p>

                </div>

            </div>

        </sly>

    </div>

</div>
