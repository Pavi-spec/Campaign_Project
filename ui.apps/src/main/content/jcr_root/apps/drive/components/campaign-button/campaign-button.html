<style>
    .campaign-button-component {
        width: 100%;
        margin-top: 10px;
        padding: 0;
    }

    .campaign-button-component .btn {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 5px;
        background-color: #1473e6;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .campaign-button-component .btn:hover {
        background-color: #0d66d0;
    }

    /* Hide AEM accessibility text visually */
    .campaign-button-component .cmp-link__screen-reader-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: inset(50%) !important;
        white-space: nowrap !important;
        border: 0 !important;
    }
</style>

<div class="campaign-button-component">

    <a
            href="${properties.link}.html"
            class="btn btn-primary"
            target="${properties.openInNewTab == 'true' ? '_blank' : '_self'}">

        ${properties.label}

    </a>

</div>
