<sly data-sly-use.model="com.drive.core.models.TestimonialModel"/>

<div class="testimonial-edit">

    <h2 class="testimonial-edit__title">
        ${model.title}
    </h2>

    <div class="testimonial-edit__items">

        <div
                class="testimonial-edit__item"
                data-sly-list.item="${model.testimonials}">

            <div class="testimonial-edit__header">

                <h3 class="testimonial-edit__customer-name">
                    ${item.name}
                </h3>

                <span class="testimonial-edit__rating-value">
                    ${item.rating}/5
                </span>

            </div>

            <p class="testimonial-edit__review">
                ${item.review}
            </p>

            <div class="testimonial-edit__footer">

                <span>
                    ${item.source}
                </span>

                <span>
                    ${item.date}
                </span>

            </div>

        </div>

    </div>

</div>
