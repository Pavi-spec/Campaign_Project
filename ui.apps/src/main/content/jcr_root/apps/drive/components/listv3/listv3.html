<sly data-sly-use.model="com.drive.core.models.ListV3Model">

    <div
            class="cmp-list"
            id="${model.id}">

        <ul
                class="cmp-list__items"
                data-sly-list.item="${model.items}">


            <sly data-sly-test="${!model.displayItemAsTeaser}">

                <li class="cmp-list__item">

                    <sly data-sly-test="${model.linkItems}">

                        <a
                                class="cmp-list__item-link"
                                href="${item.url}">

                            <span class="cmp-list__item-title">
                                ${item.displayTitle}
                            </span>

                        </a>

                    </sly>

                    <sly data-sly-test="${!model.linkItems}">

                        <span class="cmp-list__item-title">
                            ${item.displayTitle}
                        </span>

                    </sly>

                    <p
                            class="cmp-list__item-description"
                            data-sly-test="${model.showDescription && item.description}">

                        ${item.description}

                    </p>

                    <time
                            class="cmp-list__item-date"
                            data-sly-test="${model.showModificationDate && item.lastModified}">

                        ${item.lastModified.time}

                    </time>

                </li>

            </sly>



            <sly data-sly-test="${model.displayItemAsTeaser}">

                <li class="cmp-list__item cmp-list__item--teaser">

                    <article class="cmp-teaser">

                        <div class="cmp-teaser__content">

                            <h3 class="cmp-teaser__title">

                                <sly data-sly-test="${model.linkItems}">

                                    <a
                                            class="cmp-teaser__title-link"
                                            href="${item.url}">

                                        ${item.displayTitle}

                                    </a>

                                </sly>

                                <sly data-sly-test="${!model.linkItems}">

                                    ${item.displayTitle}

                                </sly>

                            </h3>

                            <p
                                    class="cmp-teaser__description"
                                    data-sly-test="${model.showDescription && item.description}">

                                ${item.description}

                            </p>

                            <time
                                    class="cmp-teaser__date"
                                    data-sly-test="${model.showModificationDate && item.lastModified}">

                                ${item.lastModified.time}

                            </time>

                            <a
                                    class="cmp-teaser__action"
                                    href="${item.url}"
                                    data-sly-test="${model.linkItems}">

                                Read more

                            </a>

                        </div>

                    </article>

                </li>

            </sly>

        </ul>

        <p
                class="cmp-list__empty"
                data-sly-test="${model.empty}">

            No results found.

        </p>

    </div>

</sly>
